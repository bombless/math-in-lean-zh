name: Build PDF
on: [push, pull_request]  # 触发条件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-recommended texlive-xetex latexmk
          pip install -r scripts/requirements.txt  # 如果有的话

      - name: Build Sphinx PDF
        run: |
          python scripts/clean.py
          python scripts/mkall.py
          make latexpdf  # 使用 Makefile
          # 或者直接调用 sphinx-build
          # sphinx-build -b latex docs/source docs/build/latex
          # cd docs/build/latex && latexmk -xelatex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: build/latex/*.pdf  # 根据实际路径调整